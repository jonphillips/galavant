name: Galavant
options:
  bundleIdPrefix: com.jonphillips
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: XZWX2M8H8V
    CODE_SIGN_STYLE: Automatic
packages:
  GalavantLibrary:
    path: GalavantLibrary
  WebExtractorKit:
    path: ../../jon-platform/packages/WebExtractorKit
  LLMClientKit:
    path: ../../jon-platform/packages/LLMClientKit
  CloudSyncKit:
    path: ../../jon-platform/packages/CloudSyncKit
  sqlite-data:
    url: https://github.com/pointfreeco/sqlite-data
    from: 1.0.0
  swift-navigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: 2.0.0
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.0.0
  swift-case-paths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: 1.0.0
  swift-sharing:
    url: https://github.com/pointfreeco/swift-sharing
    from: 2.0.0
targets:
  Galavant:
    type: application
    platform: iOS
    sources:
      - Galavant
    info:
      path: Galavant/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
        CFBundleDisplayName: Galavant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - target: GalavantShare
      - package: GalavantLibrary
        product: GalavantSchema
      - package: GalavantLibrary
        product: GalavantPlaces
      - package: GalavantLibrary
        product: GalavantChat
      - package: LLMClientKit
        product: LLMClientKit
      - package: CloudSyncKit
        product: CloudSyncKit
      - package: GalavantLibrary
        product: GalavantCaptureUI
      - package: WebExtractorKit
        product: WebExtractorKit
      - package: sqlite-data
        product: SQLiteData
      - package: swift-navigation
        product: SwiftUINavigation
      - package: swift-dependencies
        product: Dependencies
      - package: swift-case-paths
        product: CasePaths
      - package: swift-sharing
        product: Sharing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.galavant
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Galavant/Galavant.entitlements
  GalavantShare:
    type: app-extension
    platform: iOS
    sources:
      - GalavantShare
    dependencies:
      - package: GalavantLibrary
        product: GalavantPlaces
      - package: GalavantLibrary
        product: GalavantSchema
      - package: GalavantLibrary
        product: GalavantCaptureUI
      - package: sqlite-data
        product: SQLiteData
      - package: swift-dependencies
        product: Dependencies
    info:
      path: GalavantShare/Info.plist
      properties:
        CFBundleDisplayName: Galavant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          # JS preprocessing hands over Safari's *rendered* DOM (post-JavaScript),
          # which beats a raw URLSession fetch for JS-heavy pages. The activation rule
          # is a predicate (ADR-0020) so it can also match a shared *location* — an
          # Apple Maps map item or a vCard — which the dictionary form has no key for.
          # The `public.url` arm keeps Safari/web shares; JS preprocessing rides along.
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att, ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" || ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.vcard" || ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.mapkit.map-item").@count > 0).@count > 0'
            NSExtensionJavaScriptPreprocessingFile: ExtensionPreProcessing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.galavant.share
        CODE_SIGN_ENTITLEMENTS: GalavantShare/GalavantShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
  GalavantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GalavantUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Galavant
schemes:
  Galavant:
    build:
      targets:
        Galavant: all
    run:
      config: Debug
      # Metal API Validation off for Run: MapKit's own renderer trips a false
      # MSAA-resolve assertion on the iOS 27 simulator beta (docs/KNOWN-ISSUES.md).
      # Debug-only diagnostic, never in Release; the offending pass isn't ours.
      enableGPUValidationMode: false
      # Launch args live here (not just in Xcode) so `xcodegen generate` doesn't
      # wipe them. --seed-demo populates the demo dataset; --reset-identity clears
      # the device-local planner on launch.
      commandLineArguments:
        "--seed-demo": true
        "--reset-identity": false
    test:
      config: Debug
      targets:
        - GalavantUITests
