name: CI

# Thin caller — the pipeline lives once in jon-platform's reusable workflow so every
# app shares one source of truth (jon-platform docs/ios/drift-control.md § CI).
# Depends on two one-time account settings documented there: cross-repo Actions
# access on jon-platform, and this repo's JON_PLATFORM_PAT secret (passed via
# `secrets: inherit`).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: jonphillips/jon-platform/.github/workflows/ios-ci.yml@main
    with:
      package-path: GalavantLibrary
      test-runner: macos-26   # package floor is the macOS 26 SDK; the hosted image builds it today
    secrets: inherit
