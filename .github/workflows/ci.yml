name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The drift gate (zero Xcode needed): size thresholds catch growing models,
  # the view_persistence custom rule catches logic leaking into views.
  # Pinned to the local SwiftLint version for reproducibility.
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.63.3
    steps:
      - uses: actions/checkout@v4
      - run: swiftlint lint --strict

  # The package holds all the tests (the app target has no test bundle). Needs the
  # macOS 26 SDK — the package's deployment floor — but NOT Xcode 27 beta (that's
  # only for the app). If the macos-26 image/label isn't available yet on hosted
  # runners, switch this to a self-hosted runner or pin once GA.
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # GalavantLibrary consumes three lifted packages by LOCAL PATH
      # (../../../jon-platform/packages/{WebExtractorKit,LLMClientKit,CloudSyncKit} —
      # jon-platform ADR-0002/0003). Locally that resolves because ~/code/galavant/galavant
      # sits beside ~/code/jon-platform; on the runner jon-platform isn't checked out, so
      # SPM resolution fails before any test runs. Clone the (private) jon-platform repo to
      # the exact sibling path those relative deps point at. Needs a read-only PAT for the
      # private repo (the workflow's built-in GITHUB_TOKEN can't cross repositories):
      # repo secret JON_PLATFORM_PAT (fine-grained, Contents: read on jonphillips/jon-platform).
      - name: Check out jon-platform beside galavant (local-path SPM deps)
        env:
          JON_PLATFORM_PAT: ${{ secrets.JON_PLATFORM_PAT }}
        run: |
          set -euo pipefail
          # Resolve the sibling location GalavantLibrary's deps expect: from
          # GalavantLibrary/, "../../../jon-platform" == three levels up + jon-platform.
          dest="$(cd "$GITHUB_WORKSPACE/GalavantLibrary" && cd ../../.. && pwd)/jon-platform"
          echo "Cloning jon-platform to $dest"
          git clone --depth 1 \
            "https://x-access-token:${JON_PLATFORM_PAT}@github.com/jonphillips/jon-platform.git" \
            "$dest"
      - run: swift test --package-path GalavantLibrary
